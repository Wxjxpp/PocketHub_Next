name: Build Release APK

on:
  push:
    branches: [main, ui-redesign]
  workflow_dispatch:

# Never let two release jobs race over version.properties, APKs and tags.
concurrency:
  group: pockethub-release-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history made checkout grow to ~1 GB because every release APK
          # used to be committed. 50 commits is plenty for changelog generation
          # (we tag every build) while keeping the checkout small.
          fetch-depth: 50
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (auto-bump version)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Generate bilingual changelog (AI when LLM_API_KEY is set, deterministic fallback)
        run: |
          mapfile -t LOG_LINES < <(
            git log --pretty=format:'%s' -n 40 \
              --grep='chore: release' --invert-grep
          )
          printf '%s\n' "${LOG_LINES[@]}" > /tmp/commits.txt
          python3 scripts/gen_changelog.py /tmp/commits.txt > /tmp/changelog.json \
            || echo '{"items":[]}' > /tmp/changelog.json
          echo "changelog: $(cat /tmp/changelog.json)"

      # Expose the built APK as a workflow artifact so the run detail page
      # (GitHub web + PocketHub app) shows it under "Artifacts" per run.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pockethub-apk
          path: apk/*.apk
          if-no-files-found: error

      - name: Commit version bump + archived APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties apk/
          git commit -m "chore: release v$(grep '^versionName=' version.properties | cut -d= -f2) [skip ci]" || true
          git push

      - name: Create GitHub Release with APK asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          VERSION_NAME=$(grep '^versionName=' version.properties | cut -d= -f2)
          APK=$(ls apk/pockethub-${VERSION_NAME}.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && { echo "No APK found, skipping release"; exit 0; }

          # Structured bilingual changelog (generated in the earlier step).
          # Body layout: human-readable zh/en sections for the GitHub web page,
          # plus a single-line <!--pockethub-changelog {json}--> block that the
          # in-app update dialog reads directly (locale-matched, no runtime
          # translation). JSON is emitted on ONE line by design.
          CHANGELOG_JSON=$(cat /tmp/changelog.json 2>/dev/null || echo '{"items":[]}')

          NOTES_FILE=$(mktemp)
          {
            echo "## PocketHub v${VERSION_NAME}"
            echo
            python3 - "$CHANGELOG_JSON" <<'PYEOF'
import json, sys
try:
    data = json.loads(sys.argv[1])
    items = data.get("items", [])
except Exception:
    items = []
if items:
    print("### 更新说明")
    for it in items:
        print(f"- {it.get('zh','')}")
    print()
    print("### What's new")
    for it in items:
        print(f"- {it.get('en','')}")
PYEOF
            # Single-line machine block for the app (HTML comment = invisible on the web page).
            echo "<!--pockethub-changelog ${CHANGELOG_JSON}-->"
          } > "$NOTES_FILE"

          # Build changelog from recent commits —
          # Exclude the version-bump commit itself and any other chore:[skip ci] noise
          # so the release notes surface feature / fix commits since the last release.
          mapfile -t LOG_LINES < <(
            git log --pretty=format:'%s' -n 60 \
              --grep='chore: release' --invert-grep
          )
          CHANGELOG=""
          for line in "${LOG_LINES[@]}"; do
            # Skip merge commits and blank lines
            [[ "$line" =~ ^Merge\  ]] && continue
            [[ -z "$line" ]] && continue
            CHANGELOG+="- $line
          "
          done
          # Cap the changelog to keep release notes skimmable on the in-app update dialog.
          CHANGELOG=$(printf '%s' "$CHANGELOG" | head -c 1800)

          NOTES_FILE=$(mktemp)
          {
            echo "## PocketHub v${VERSION_NAME}"
            echo
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG" | head -40
            else
              echo "Auto-built release APK for PocketHub v${VERSION_NAME}."
            fi
          } > "$NOTES_FILE"

          # Replace existing release/tag if re-running on the same version.
          gh release delete "v${VERSION_NAME}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${VERSION_NAME}" "$APK" \
            --title "PocketHub v${VERSION_NAME}" \
            --notes-file "$NOTES_FILE"

          # Prune old releases/tags, keep only the newest 2.
          # `gh release list` output columns: Title / Type / Tag / Published
          # Sort by Published ascending so the oldest are at the top.
          mapfile -t ALL_TAGS < <(gh release list --json tagName --jq '.[].tagName' | sort -V -r)
          TOTAL=${#ALL_TAGS[@]}
          echo "Found $TOTAL releases, keeping newest 2"
          if [ "$TOTAL" -gt 2 ]; then
            for tag in "${ALL_TAGS[@]:2}"; do
              echo "Pruning old release+tag: $tag"
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            done
          fi
